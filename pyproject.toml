[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-proxy"
version = "0.1.0"
description = "Anthropic reverse proxy with OAuth key rotation, an OpenAI-compatible endpoint, and a usage-cost dashboard"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nikolay Zhidenko", email = "dragg.ko@gmail.com"}]
keywords = ["anthropic", "claude", "proxy", "oauth", "openai-compatible"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: Proxy Servers",
]
requires-python = ">=3.11"
dependencies = [
    # [brotli] is load-bearing, not an optimisation: the OAuth refresh headers
    # advertise `br`, and httpx silently hands back undecoded bytes for a
    # Content-Encoding it has no decoder for — which loses the rotated refresh
    # token and bricks the key. See tests/test_anthropic_oauth_refresh.py.
    "httpx[brotli]>=0.27",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.3.3",
]

[project.urls]
Homepage = "https://github.com/dragg/smart-proxy"
Source = "https://github.com/dragg/smart-proxy"
Issues = "https://github.com/dragg/smart-proxy/issues"

[project.scripts]
smart-proxy = "smart_proxy.__main__:main"

[dependency-groups]
dev = ["pytest"]

